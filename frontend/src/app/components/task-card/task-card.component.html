<div
  class="task-card"
  draggable="true"
  (dragstart)="onDragStart($event)"
  (dragend)="onDragEnd($event)"
>
  <div class="task-card-header">
    <div class="task-title">{{ task().title }}</div>
    <div class="task-actions">
      <button class="task-action-btn" (click)="edit.emit(task())" title="Edit">✎</button>
      <button class="task-action-btn del" (click)="delete.emit(task().id)" title="Delete">✕</button>
    </div>
  </div>

  @if (task().description) {
    <div class="task-desc">{{ task().description }}</div>
  }

  <div class="task-footer">
    <span class="priority-badge" [ngClass]="'priority-' + task().priority">
      {{ task().priority }}
    </span>

    <div class="task-footer-right">
      @if (dueInfo(); as info) {
        <span class="due-date" [ngClass]="info.cls">◷ {{ info.label }}</span>
      }

      <div class="move-btns">
        @if (prevColumn(); as prev) {
          <button class="move-btn" (click)="moveTo(prev.id)">
            ← {{ prev.label.split(' ')[0] }}
          </button>
        }
        @if (nextColumn(); as next) {
          <button class="move-btn" (click)="moveTo(next.id)">
            {{ next.label.split(' ')[0] }} →
          </button>
        }
      </div>
    </div>
  </div>
</div>
