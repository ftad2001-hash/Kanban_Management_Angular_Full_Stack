<aside class="sidebar">
  <div class="sidebar-header">Boards</div>

  <div class="sidebar-boards">
    @if (boards().length === 0) {
      <div class="empty-msg">No boards yet.<br>Create one below.</div>
    }

    @for (board of boards(); track board.id) {
      <a
        class="board-item"
        [routerLink]="['/board', board.id]"
        routerLinkActive="active"
      >
        <div class="board-item-left">
          <div class="board-color" [style.background]="board.color"></div>
          <div class="board-item-name" [title]="board.name">{{ board.name }}</div>
        </div>
        <span class="board-count">{{ taskCount(board) }}</span>
        <button
          class="board-delete"
          (click)="deleteBoard($event, board)"
          title="Delete board"
        >✕</button>
      </a>
    }
  </div>

  <div class="sidebar-footer">
    <button class="btn btn-ghost btn-full btn-sm" (click)="newBoard.emit()">
      <span class="plus">+</span> New Board
    </button>
  </div>
</aside>
